[package]
name = "relay-e2e"
description = "Recipient-only asynchronous encryption for Project Relay mesh envelopes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chacha20poly1305 = "=0.10.1"
getrandom = "=0.2.17"
hmac = "=0.12.1"
relay-message = { path = "../relay-message" }
relay-wire = { path = "../relay-wire" }
sha2 = "=0.10.9"
subtle = "=2.6.1"
vodozemac = { version = "=0.10.0", default-features = false, features = [
    "experimental-session-config",
] }
zeroize = "=1.9.0"

[dev-dependencies]
relay-core = { path = "../relay-core" }
relay-router = { path = "../relay-router" }

[lints]
workspace = true
