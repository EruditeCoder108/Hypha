<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Hypha — messages move, even offline</title>
<desc id="desc">An illustrated encrypted message passes from sender to courier to recipient. A genuine receipt returns to the sender. This is a conceptual handoff, not a radio simulation.</desc>
<rect x="1" y="1" width="1198" height="478" rx="22" fill="#f7faf8" stroke="#d9e5de"/>
<g font-family="Segoe UI,DejaVu Sans,Arial,sans-serif">
<circle cx="67" cy="55" r="4" fill="#166c48"/>
<text x="81" y="59" fill="#166c48" font-size="13" font-weight="600" letter-spacing="1">OFFLINE BY DESIGN</text>
<g fill="#16241f" font-size="58" font-weight="600"><text x="60" y="170">Messages move.</text><text x="60" y="238">Even offline.</text></g>
<g fill="#697b72" font-size="19"><text x="64" y="298">Private conversations, carried by nearby</text><text x="64" y="326">phones and fixed courier nodes.</text></g>
<text x="64" y="379" fill="#166c48" font-size="12" font-weight="600">NO INTERNET. NO CENTRAL MESSAGE SERVER.</text>
<text x="827" y="56" text-anchor="middle" fill="#166c48" font-size="12" font-weight="600">ENCRYPT / CARRY / DELIVER / RECEIPT</text>
